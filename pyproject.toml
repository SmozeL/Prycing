[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prycing-asian"
version = "1.0.0"
description = "Étude Monte-Carlo d'options asiatiques arithmétiques sur SPX et RUT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.26,<3", "scipy>=1.13,<2"]

[project.optional-dependencies]
rapport = ["reportlab>=4.2,<5"]

[tool.setuptools.packages.find]
include = ["asian_pricing*"]
